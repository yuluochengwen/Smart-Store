{% extends "base/base.html" %}

{% block title %}管理控制台 - SmartStore{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% endblock %}

{% block content %}
    <!-- 顶部标题 -->
    <section class="page-header bg-gradient-to-r from-blue-600 to-purple-600 text-white py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-4xl font-bold mb-2">管理控制台</h1>
            <p class="text-blue-100">概览关键指标，查看趋势与近期交易。</p>
        </div>
    </section>

    <!-- KPI 指标卡片 -->
    <section class="py-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="bg-white rounded-2xl shadow p-6">
                    <div class="text-sm text-gray-500 mb-2">今日销售额</div>
                    <div id="kpi-today-sales" class="text-3xl font-bold">¥0.00</div>
                    <div id="kpi-growth-sales" class="text-green-600 text-sm mt-1">+0%</div>
                </div>
                <div class="bg-white rounded-2xl shadow p-6">
                    <div class="text-sm text-gray-500 mb-2">今日订单</div>
                    <div id="kpi-today-orders" class="text-3xl font-bold">0</div>
                    <div id="kpi-growth-orders" class="text-green-600 text-sm mt-1">+0%</div>
                </div>
                <div class="bg-white rounded-2xl shadow p-6">
                    <div class="text-sm text-gray-500 mb-2">注册用户</div>
                    <div id="kpi-users" class="text-3xl font-bold">0</div>
                    <div class="text-gray-500 text-sm mt-1">累计</div>
                </div>
                <div class="bg-white rounded-2xl shadow p-6">
                    <div class="text-sm text-gray-500 mb-2">商品总数</div>
                    <div id="kpi-products" class="text-3xl font-bold">0</div>
                    <div class="text-gray-500 text-sm mt-1">在售</div>
                </div>
            </div>
        </div>
    </section>

    <!-- 图表与最近交易 -->
    <section class="pb-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white rounded-2xl shadow p-6">
                <div class="text-lg font-semibold mb-4">销售趋势（近14天）</div>
                <div id="sales-trend-chart" style="height:320px;"></div>
            </div>
            <div class="bg-white rounded-2xl shadow p-6">
                <div class="flex items-center justify-between mb-4">
                    <div class="text-lg font-semibold">热销商品 TOP 5</div>
                    <select id="top-range" class="border rounded px-2 py-1 text-sm">
                        <option value="7">近7天</option>
                        <option value="14" selected>近14天</option>
                        <option value="30">近30天</option>
                    </select>
                </div>
                <div id="top-products-chart" style="height:320px;"></div>
            </div>
            <div class="bg-white rounded-2xl shadow p-6 lg:col-span-2">
                <div class="flex items-center justify-between mb-4">
                    <div class="text-lg font-semibold">最近交易</div>
                    <div class="flex items-center gap-3">
                        <select id="recent-range" class="border rounded px-2 py-1 text-sm">
                            <option value="7">近7天</option>
                            <option value="14" selected>近14天</option>
                            <option value="30">近30天</option>
                        </select>
                        <a href="{{ url_for('order_manage') }}" class="text-blue-600 text-sm hover:underline">查看全部</a>
                    </div>
                </div>
                <div id="recent-transactions" class="grid gap-3"></div>
            </div>
        </div>
    </section>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
    <script>
        // 如果 admin.js 未自动触发，这里确保初始化
        if (window.adminManager && typeof window.adminManager.initDashboard === 'function') {
            window.adminManager.initDashboard();
            const $ = (id)=>document.getElementById(id);
            const rebind = ()=>{
                const tr = $('top-range');
                const rr = $('recent-range');
                if (tr) tr.addEventListener('change', ()=>window.adminManager.initDashboard());
                if (rr) rr.addEventListener('change', ()=>window.adminManager.initDashboard());
            };
            rebind();
        }
    </script>
{% endblock %}
