{% extends "base/base.html" %}

{% block title %}销售分析 - SmartStore{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% endblock %}

{% block content %}
    <section class="page-header bg-gradient-to-r from-green-600 to-blue-600 text-white py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-4xl font-bold mb-2">销售分析</h1>
            <p class="text-blue-100">实时监控销售数据与趋势</p>
        </div>
    </section>

    <section class="sales-analysis py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                    <div class="text-2xl font-semibold">销售趋势</div>
                    <div class="flex items-center gap-3">
                        <select id="sa-granularity" class="border rounded px-3 py-2">
                            <option value="day">按日</option>
                            <option value="week">按周</option>
                            <option value="month">按月</option>
                        </select>
                        <select id="sa-dimension" class="border rounded px-3 py-2">
                            <option value="category">按品类</option>
                            <option value="channel">按渠道</option>
                        </select>
                        <select id="sa-range" class="border rounded px-3 py-2">
                            <option value="7">近7</option>
                            <option value="14" selected>近14</option>
                            <option value="30">近30</option>
                            <option value="90">近90</option>
                        </select>
                    </div>
                </div>
                <div id="sa-chart" style="height: 400px;"></div>
            </div>
        </div>
    </section>
{% endblock %}

{% block scripts %}
    <script>
        const el = document.getElementById('sa-chart');
        const chart = echarts.init(el);
        function loadSA() {
            const g = document.getElementById('sa-granularity').value;
            const d = document.getElementById('sa-dimension').value;
            const r = document.getElementById('sa-range').value;
            fetch(`/api/admin/sales/analysis?granularity=${g}&dimension=${d}&range=${r}`)
              .then(r=>r.json()).then(payload=>{
                chart.setOption({
                    tooltip:{trigger:'axis'},
                    legend:{data:payload.series.map(s=>s.name)},
                    xAxis:{type:'category',data:payload.x},
                    yAxis:{type:'value',name:'销售额(¥)'},
                    series: payload.series.map(s=>({name:s.name,type:'line',smooth:true,data:s.data}))
                });
              });
        }
        document.getElementById('sa-granularity').addEventListener('change', loadSA);
        document.getElementById('sa-dimension').addEventListener('change', loadSA);
        document.getElementById('sa-range').addEventListener('change', loadSA);
        loadSA();
        window.addEventListener('resize', ()=>chart.resize());
    </script>
{% endblock %}
