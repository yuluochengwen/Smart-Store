{% extends "base/base.html" %}

{% block title %}系统设置 - SmartStore{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% endblock %}

{% block content %}
    <section class="page-header bg-gradient-to-r from-blue-600 to-purple-600 text-white py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-4xl font-bold mb-2">系统设置</h1>
            <p class="text-blue-100">管理系统的配置和设置</p>
        </div>
    </section>

    <section class="system-settings py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="bg-white rounded-2xl shadow-lg p-6">
                <h2 class="text-lg font-semibold mb-4">基本设置</h2>
                <form id="settings-form" class="space-y-6">
                    <div>
                        <label for="site-name" class="block text-sm font-medium text-gray-700 mb-2">网站名称</label>
                        <input type="text" id="site-name" name="site_name" required
                               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label for="site-email" class="block text-sm font-medium text-gray-700 mb-2">联系邮箱</label>
                        <input type="email" id="site-email" name="site_email" required
                               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label for="site-phone" class="block text-sm font-medium text-gray-700 mb-2">联系电话</label>
                        <input type="tel" id="site-phone" name="site_phone"
                               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div class="flex space-x-3">
                        <button type="button" id="cancel-settings" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-lg hover:bg-gray-200 transition-colors">
                            取消
                        </button>
                        <button type="submit" id="save-settings" class="flex-1 bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition-colors">
                            保存设置
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% endblock %}
