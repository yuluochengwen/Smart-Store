{% extends "base/base.html" %}

{% block title %}找回密码 - SmartStore{% endblock %}

{% block content %}
<section class="page-header bg-gradient-to-r from-blue-600 to-blue-800 text-white py-16">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <h1 class="text-4xl md:text-5xl font-bold mb-4">找回密码</h1>
    <p class="text-xl text-blue-100">输入注册邮箱以接收重置链接</p>
  </div>
</section>

<section class="py-12">
  <div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <form id="forgot-form" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">注册邮箱</label>
          <input name="email" type="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="请输入邮箱">
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-3 rounded-lg text-lg font-semibold hover:from-blue-700 hover:to-blue-800 transition-all">
          发送重置链接
        </button>
      </form>

      <div id="reset-section" class="mt-8 hidden">
        <hr class="my-6" />
        <p class="text-sm text-gray-600 mb-4">已获得重置令牌？在此设置新密码：</p>
        <form id="reset-form" class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">重置令牌</label>
            <input name="token" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="输入收到的令牌">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">新密码</label>
            <input name="newPassword" type="password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="请输入新密码">
          </div>
          <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg text-lg font-semibold hover:bg-green-700 transition-all">
            更新密码
          </button>
        </form>
      </div>

      <p class="text-center text-sm text-gray-600 mt-6">
        记起密码了？
        <a href="{{ url_for('login') }}" class="text-blue-600 hover:text-blue-500 font-semibold">返回登录</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  // 发送重置链接
  document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = e.target.email.value.trim();
    try {
      const resp = await fetch('/api/password/forgot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await resp.json();
      if (resp.ok && data.success) {
        alert(data.message + (data.token ? `\n演示令牌: ${data.token}` : ''));
        document.getElementById('reset-section').classList.remove('hidden');
        // 将演示 token 自动填入，便于测试
        if (data.token) {
          document.querySelector('#reset-form input[name="token"]').value = data.token;
        }
      } else {
        alert(data.message || '发送失败');
      }
    } catch (err) {
      console.error(err);
      alert('网络异常，请稍后再试');
    }
  });

  // 提交新密码
  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = e.target.token.value.trim();
    const newPassword = e.target.newPassword.value;
    try {
      const resp = await fetch('/api/password/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword })
      });
      const data = await resp.json();
      if (resp.ok && data.success) {
        alert('密码已更新，请使用新密码登录');
        window.location.href = "{{ url_for('login') }}";
      } else {
        alert(data.message || '重置失败');
      }
    } catch (err) {
      console.error(err);
      alert('网络异常，请稍后再试');
    }
  });
</script>
{% endblock %}
