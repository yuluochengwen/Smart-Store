{% extends "base/base.html" %}

{% block title %}用户注册 - SmartStore{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/user.css') }}">
{% endblock %}

{% block content %}
<section class="page-header bg-gradient-to-r from-blue-600 to-blue-800 text-white py-16">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <h1 class="text-4xl md:text-5xl font-bold mb-4">用户注册</h1>
    <p class="text-xl text-blue-100">创建您的 SmartStore 账户</p>
  </div>
</section>

<section class="py-12">
  <div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <form id="register-form" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
          <input name="username" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="请输入用户名">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">邮箱</label>
          <input name="email" type="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="请输入邮箱">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
          <input name="password" type="password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="请输入密码">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">确认密码</label>
          <input name="confirmPassword" type="password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="请再次输入密码">
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-3 rounded-lg text-lg font-semibold hover:from-blue-700 hover:to-blue-800 transition-all">
          立即注册
        </button>
      </form>

      <p class="text-center text-sm text-gray-600 mt-6">
        已有账号？
        <a href="{{ url_for('login') }}" class="text-blue-600 hover:text-blue-500 font-semibold">去登录</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const payload = {
      username: form.username.value.trim(),
      email: form.email.value.trim(),
      password: form.password.value,
    };
    if (form.password.value !== form.confirmPassword.value) {
      alert('两次密码不一致');
      return;
    }
    try {
      const resp = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await resp.json();
      if (resp.ok && data.success) {
        alert('注册成功，去登录');
  window.location.href = "{{ url_for('login') }}";
      } else {
        alert(data.message || '注册失败');
      }
    } catch (err) {
      console.error(err);
      alert('网络异常，请稍后再试');
    }
  });
</script>
{% endblock %}
